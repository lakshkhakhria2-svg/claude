<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#ddd;display:flex;flex-wrap:wrap;gap:20px;padding:20px}
  .tile{width:1024px;height:1024px;position:relative;overflow:hidden;display:grid;place-items:center;font-family:Archivo,sans-serif}
  /* A: plum wordmark */
  #a{background:#831843}
  #a .word{margin-top:-90px;font-weight:900;font-size:360px;letter-spacing:-8px;color:#fff;line-height:1;position:relative}
  #a .dot{color:#06B6D4}
  #a svg{position:absolute;left:4%;bottom:-38px;width:92%;height:44px}
  #a .sub{position:absolute;top:calc(50% + 205px);width:100%;text-align:center;font-family:'Space Grotesk';font-weight:700;letter-spacing:34px;font-size:56px;color:#FBCFE8;padding-left:34px;box-sizing:border-box}
  /* B: gradient + play monogram */
  #b{background:radial-gradient(circle at 30% 25%,#EC4899 0%,#BE185D 45%,#831843 100%)}
  #b .mark{position:relative;width:560px;height:560px;border-radius:140px;background:#fff;display:grid;place-items:center;box-shadow:0 40px 80px rgba(0,0,0,.25)}
  #b .mark span{font-weight:900;font-size:215px;letter-spacing:-6px;color:#831843;line-height:1;margin-top:-70px}
  #b .play{position:absolute;right:-75px;top:-75px;width:200px;height:200px;border-radius:50%;background:#06B6D4;display:grid;place-items:center;border:18px solid #BE185D}
  #b .label{position:absolute;bottom:108px;left:0;right:0;text-align:center;font-family:'Space Grotesk';font-weight:700;font-size:68px;letter-spacing:22px;color:#831843;padding-left:22px}
  /* C: light, clean */
  #c{background:#FDF2F8}
  #c .word{margin-top:30px;font-weight:900;font-size:380px;letter-spacing:-14px;color:#831843;line-height:.9;text-align:center}
  #c .word b{color:#EC4899}
  #c .media{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:40px;font-family:'Space Grotesk';font-weight:700;font-size:64px;letter-spacing:20px;color:#831843}
  #c .sq{width:44px;height:44px;border-radius:12px;background:#06B6D4}
</style></head><body>
<div class="tile" id="a"><div class="word">LK<span class="dot">.</span>
  <svg viewBox="0 0 200 12" preserveAspectRatio="none"><path d="M2 9C50 3 150 3 198 9" fill="none" stroke="#EC4899" stroke-width="5" stroke-linecap="round"/></svg></div>
  <div class="sub">MEDIA</div></div>
<div class="tile" id="b"><div class="mark"><span>LK</span>
  <div class="play"><svg width="84" height="84" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="#083344"/></svg></div>
  <div class="label">MEDIA</div></div></div>
<div class="tile" id="c"><div><div class="word">LK<b>.</b></div><div class="media"><span class="sq"></span>MEDIA<span class="sq"></span></div></div></div>
</body></html>
